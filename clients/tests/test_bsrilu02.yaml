---
include: hipsparse_common.yaml


Tests:
- name: bsrilu02_bad_arg
  category: pre_checkin
  function: bsrilu02_bad_arg
  precision: *single_double_precisions_complex_real

- name: bsrilu02
  category: quick
  function: bsrilu02
  precision: *single_double_precisions
  M: 1
  N: 1
  block_dim: [6, 8, 9]
  numericboost: [0, 1]
  boosttol: [1.1]
  boostval: [0.3]
  boostvali: [0.2]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  dirA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  solve_policy: [HIPSPARSE_SOLVE_POLICY_NO_LEVEL, HIPSPARSE_SOLVE_POLICY_USE_LEVEL]
  filename: [mac_econ_fwd500,
             nos2,
             nos4,
             nos6,
             scircuit]

- name: bsrilu02
  category: pre_checkin
  function: bsrilu02
  precision: *single_double_precisions
  M: 1
  N: 1
  block_dim: [2, 3, 4]
  numericboost: [0, 1]
  boosttol: [1.1]
  boostval: [0.1]
  boostvali: [0.7]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  dirA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  solve_policy: [HIPSPARSE_SOLVE_POLICY_NO_LEVEL, HIPSPARSE_SOLVE_POLICY_USE_LEVEL]
  filename: [mac_econ_fwd500,
             scircuit]

- name: bsrilu02
  category: nightly
  function: bsrilu02
  precision: *single_double_precisions
  M: 1
  N: 1
  block_dim: [5, 7, 11]
  numericboost: [0, 1]
  boosttol: [1.1]
  boostval: [0.5]
  boostvali: [0.6]
  baseA: [HIPSPARSE_INDEX_BASE_ONE]
  dirA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  solve_policy: [HIPSPARSE_SOLVE_POLICY_NO_LEVEL, HIPSPARSE_SOLVE_POLICY_USE_LEVEL]
  filename: [amazon0312,
             bmwcra_1,
             mac_econ_fwd500,
             sme3Dc,
             webbase-1M,
             Chebyshev4]
