---
include: hipsparse_common.yaml


Tests:
- name: bsrmm_bad_arg
  category: pre_checkin
  function: bsrmm_bad_arg
  precision: *single_double_precisions_complex_real

- name: bsrmm
  category: quick
  function: bsrmm
  precision: *single_double_precisions
  M: 1
  N: [4, 13, 45]
  K: 1
  block_dim: [6, 8, 9]
  alpha: [0.5]
  beta: [1.4]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  dirA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  transA: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  transB: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  filename: [mac_econ_fwd500,
             nos2,
             nos4,
             nos6,
             scircuit]

- name: bsrmm
  category: pre_checkin
  function: bsrmm
  precision: *single_double_precisions
  M: 1
  N: [22, 37]
  K: 1
  block_dim: [2, 3, 4]
  alpha: [0.7]
  beta: [0.4]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  dirA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  transA: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  transB: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  filename: [mac_econ_fwd500,
             scircuit]

- name: bsrmm
  category: nightly
  function: bsrmm
  precision: *single_double_precisions
  M: 1
  N: [11, 43]
  K: 1
  block_dim: [5, 7, 11]
  alpha: [1.6]
  beta: [-0.4]
  baseA: [HIPSPARSE_INDEX_BASE_ONE]
  dirA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  transA: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  transB: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  filename: [amazon0312,
             bmwcra_1,
             mac_econ_fwd500,
             sme3Dc,
             webbase-1M,
             Chebyshev4]
