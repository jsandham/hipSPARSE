---
include: hipsparse_common.yaml


Tests:
- name: bsrsv2_bad_arg
  category: pre_checkin
  function: bsrsv2_bad_arg
  precision: *single_double_precisions_complex_real

- name: bsrsv2
  category: quick
  function: bsrsv2
  precision: *single_double_precisions
  M: 1
  N: 1
  block_dim: [6, 8, 9]
  alpha: [0.5]
  diag_type: [HIPSPARSE_DIAG_TYPE_NON_UNIT, HIPSPARSE_DIAG_TYPE_UNIT]
  fill_mode: [HIPSPARSE_FILL_MODE_LOWER, HIPSPARSE_FILL_MODE_UPPER]
  solve_policy: [HIPSPARSE_SOLVE_POLICY_NO_LEVEL, HIPSPARSE_SOLVE_POLICY_USE_LEVEL]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  dirA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  transA: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  filename: [mac_econ_fwd500,
             nos2,
             nos4,
             nos6,
             scircuit]

- name: bsrsv2
  category: pre_checkin
  function: bsrsv2
  precision: *single_double_precisions
  M: 1
  N: 1
  block_dim: [2, 3, 4]
  alpha: [-0.5]
  diag_type: [HIPSPARSE_DIAG_TYPE_NON_UNIT, HIPSPARSE_DIAG_TYPE_UNIT]
  fill_mode: [HIPSPARSE_FILL_MODE_LOWER, HIPSPARSE_FILL_MODE_UPPER]
  solve_policy: [HIPSPARSE_SOLVE_POLICY_NO_LEVEL, HIPSPARSE_SOLVE_POLICY_USE_LEVEL]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  dirA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  transA: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  filename: [mac_econ_fwd500,
             scircuit]

- name: bsrsv2
  category: nightly
  function: bsrsv2
  precision: *single_double_precisions
  M: 1
  N: 1
  block_dim: [5, 7, 11]
  alpha: [1.5]
  diag_type: [HIPSPARSE_DIAG_TYPE_NON_UNIT, HIPSPARSE_DIAG_TYPE_UNIT]
  fill_mode: [HIPSPARSE_FILL_MODE_LOWER, HIPSPARSE_FILL_MODE_UPPER]
  solve_policy: [HIPSPARSE_SOLVE_POLICY_NO_LEVEL, HIPSPARSE_SOLVE_POLICY_USE_LEVEL]
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  dirA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  transA: [HIPSPARSE_OPERATION_NON_TRANSPOSE, HIPSPARSE_OPERATION_TRANSPOSE]
  filename: [amazon0312,
             bmwcra_1,
             mac_econ_fwd500,
             sme3Dc,
             webbase-1M,
             Chebyshev4]
