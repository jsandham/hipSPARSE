---
include: hipsparse_common.yaml


Tests:
- name: csrgemm_bad_arg
  category: pre_checkin
  function: csrgemm_bad_arg
  precision: *single_double_precisions_complex_real

- name: csrgemm
  category: quick
  function: csrgemm
  precision: *single_double_precisions
  M: 1
  N: [24, 87]
  K: 1
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ONE]
  baseC: [HIPSPARSE_INDEX_BASE_ONE]
  transA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  transB: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  filename: [mac_econ_fwd500,
             nos2,
             nos4,
             nos6,
             scircuit]

- name: csrgemm
  category: pre_checkin
  function: csrgemm
  precision: *single_double_precisions
  M: 1
  N: [465, 890]
  K: 1
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ONE]
  baseC: [HIPSPARSE_INDEX_BASE_ONE]
  transA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  transB: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  filename: [mac_econ_fwd500,
             scircuit]

- name: csrgemm
  category: nightly
  function: csrgemm
  precision: *single_double_precisions
  M: 1
  N: [2400]
  K: 1
  baseA: [HIPSPARSE_INDEX_BASE_ZERO]
  baseB: [HIPSPARSE_INDEX_BASE_ONE]
  baseC: [HIPSPARSE_INDEX_BASE_ONE]
  transA: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  transB: [HIPSPARSE_DIRECTION_ROW, HIPSPARSE_DIRECTION_COLUMN]
  filename: [amazon0312,
             bmwcra_1,
             mac_econ_fwd500,
             sme3Dc,
             webbase-1M,
             Chebyshev4]
